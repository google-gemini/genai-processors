# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install .[contrib]
        pip install .[dev]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # We run other checks in advisory mode, so --xit-zero treats all errors as warning.
        # Line length is enforced by internal pylint so here we set a very generous limit.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=500 --indent-size=2 --statistics
    - name: Test with pytest
      run: |
        pytest

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Build and check PyPI version
      id: check_version
      run: |
        python -m pip install --upgrade pip build twine packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/genai-processors/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - name: Clean up stale releases from staging repo
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        # clean up stale releases from staging repo
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="genai-processors--pypi" \
            --format="value(name)" 2>/dev/null)

        echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="genai-processors--pypi" \
                --quiet
        '

    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/genai-processors--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/genai-processors/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
